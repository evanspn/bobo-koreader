name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [kobo]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev podman gettext
          echo "CROSS_CONTAINER_ENGINE=podman" >> $GITHUB_ENV

      - name: Install Rust 1.91.1
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-${{ matrix.target }}-

      - name: Cache Podman images
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: ${{ runner.os }}-podman-cross-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite

      - name: Prepare sqlx database
        env:
          DATABASE_URL: sqlite:///tmp/bobo-build.db
        run: cd backend/shared && cargo sqlx db create && cargo sqlx migrate run

      - name: Get next version
        id: get-next-version
        run: |
          npm install -D semantic-release-export-data
          npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build plugin
        env:
          DATABASE_URL: sqlite:///tmp/bobo-build.db
        run: |
          export SEMANTIC_RELEASE_VERSION="${{ steps.get-next-version.outputs.new-release-git-tag }}"
          bash scripts/build-all.sh ${{ matrix.target }}

      - name: Package
        run: cd build && zip -r bobo-${{ matrix.target }}.zip bobo.koplugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: build/bobo-${{ matrix.target }}.zip

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true

      - name: Publish
        run: |
          npm install -D semantic-release-export-data
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
