name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-lua:
    name: Lua unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and busted
        run: |
          sudo apt-get update -q
          sudo apt-get install -y luajit luarocks
          sudo luarocks install busted

      - name: Run tests
        run: busted --lua luajit -C frontend/bobo.koplugin .

  test-rust:
    name: Rust tests & lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///tmp/bobo-ci.db
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Install Rust 1.91.1
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features sqlite

      - name: Create and migrate test database
        run: |
          cd backend/shared
          cargo sqlx db create
          cargo sqlx migrate run

      - name: Tests
        run: cd backend && cargo test --all
